# VeyaShip - Alembic 数据库迁移配置
# ===================================
# 用法：
#   查看当前版本  alembic current
#   升级到最新    alembic upgrade head
#   生成新迁移    alembic revision --autogenerate -m "描述"
#   回退一步      alembic downgrade -1
#   Docker 内执行：docker compose exec backend alembic upgrade head
#
# 首次部署（生产）：
#   1. 启动服务（init_db 自动创建所有表）
#   2. alembic stamp head   # 标记为已迁移
#
# 后续改模型：
#   1. 改 models/xxx.py
#   2. alembic revision --autogenerate -m "改了啥"
#   3. 检查生成的迁移文件
#   4. alembic upgrade head

[alembic]
script_location = migrations
sqlalchemy.url = postgresql://crossborder:change_this_password@localhost:5432/crossborder_ai

# 日志
[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
