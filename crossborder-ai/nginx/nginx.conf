# VeyaShip - 生产环境 Nginx 配置
# ==================================
# 使用前需修改两处：
#   1. 将所有 example.com 替换为你的实际域名
#   2. 将 SSL 证书放到 ./nginx/ssl/ 目录
#
# 首次部署流程：
#   先用 nginx.http.conf（纯 HTTP）启动，运行 certbot 获取证书
#   证书获取后，启用本 HTTPS 配置
#   参考 deploy.sh 脚本

upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:80;
}

# ════════════════════════════════════════════════════════════════
# HTTP → HTTPS 强制跳转
# ════════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name example.com www.example.com;  # ← 修改为你的域名

    # Certbot 验证用（webroot 模式）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其他所有 HTTP 请求跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ════════════════════════════════════════════════════════════════
# HTTPS 服务
# ════════════════════════════════════════════════════════════════
server {
    listen 443 ssl http2;
    server_name example.com www.example.com;  # ← 修改为你的域名

    # ── SSL 证书 ───────────────────────────────────────────
    # 如果是 Certbot 申请的：
    #   ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    #   ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    # 如果是自签名或商业证书：
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # 现代 TLS 配置（2024+ 标准）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ── 安全头 ────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Content Security Policy（严格但不影响功能）
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-inline';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: https:;
        font-src 'self';
        connect-src 'self' https:;
        frame-src 'none';
        object-src 'none';
    " always;

    # ── 前端 SPA ──────────────────────────────────────────
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 后端 API ──────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 生成请求可能较长
        proxy_read_timeout 120s;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── WebSocket ─────────────────────────────────────────
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # ── 静态资源缓存 ─────────────────────────────────────
    location /assets/ {
        proxy_pass http://frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── API 文档（生产环境关闭） ─────────────────────────
    location /docs {
        deny all;
    }

    location /openapi.json {
        deny all;
    }

    # ── 隐藏文件保护 ─────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── 上传大小限制 ─────────────────────────────────────
    client_max_body_size 50M;
}
