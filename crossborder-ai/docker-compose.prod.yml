# VeyaShip - 生产环境 Docker Compose
# =====================================
# 用法：
#   1. 在项目根目录创建 .env 文件（可参考 .env.example）
#   2. 确保 SSL 证书在 ./nginx/ssl/ 目录下
#   3. docker compose -f docker-compose.prod.yml up -d
#   4. docker compose -f docker-compose.prod.yml logs -f  # 查看日志
#
# 首次部署（自动 SSL）：
#   先启动 Nginx 获取证书：docker compose -f docker-compose.prod.yml up -d nginx
#   然后运行 certbot：docker compose -f docker-compose.prod.yml exec nginx ......
#   参考 deploy.sh 脚本

services:

  # ══════════════════════════════════════════════════════════════
  # PostgreSQL 数据库
  # ══════════════════════════════════════════════════════════════
  postgres:
    image: postgres:15-alpine
    container_name: crossborder-postgres
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 可选的定时备份脚本（自行配置）
      # - ./backups:/backups
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crossborder_ai}
      POSTGRES_USER: ${POSTGRES_USER:-crossborder}
      # 如果没有设置 POSTGRES_PASSWORD，启动会报错——这是故意的，防止空密码
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须设置 POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"  # 仅本地访问，不对外暴露
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crossborder} -d ${POSTGRES_DB:-crossborder_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - crossborder-net

  # ══════════════════════════════════════════════════════════════
  # Qdrant 向量数据库（AI 语义搜索用）
  # ══════════════════════════════════════════════════════════════
  qdrant:
    image: qdrant/qdrant:v1.10.0
    container_name: crossborder-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - crossborder-net

  # ══════════════════════════════════════════════════════════════
  # 后端 API 服务（FastAPI）
  # ══════════════════════════════════════════════════════════════
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crossborder-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    env_file:
      - .env
    environment:
      POSTGRES_SERVER: postgres
      QDRANT_HOST: qdrant
      DEBUG: "false"
      USE_SQLITE: "false"
    ports:
      - "127.0.0.1:8000:8000"
    # 生产用 gunicorn + uvicorn workers（多进程，更好利用多核 CPU）
    # 如果内存有限，改用单进程 uvicorn
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s  # 启动时间给长一点，等数据库准备
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    networks:
      - crossborder-net

  # ══════════════════════════════════════════════════════════════
  # 前端 SPA（Nginx 静态文件服务）
  # ══════════════════════════════════════════════════════════════
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crossborder-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:80"
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - crossborder-net

  # ══════════════════════════════════════════════════════════════
  # Nginx 反向代理（HTTPS + 静态文件 + API 代理）
  # ══════════════════════════════════════════════════════════════
  nginx:
    image: nginx:1.25-alpine
    container_name: crossborder-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # Certbot 证书验证目录
      - ./nginx/www:/var/www/certbot:ro
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - crossborder-net

# ── 持久化数据卷 ──────────────────────────────────────────────
volumes:
  postgres_data:
  qdrant_data:

# ── 内部网络（容器间通信） ────────────────────────────────────
networks:
  crossborder-net:
    driver: bridge
